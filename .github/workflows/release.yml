name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Materialize signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is required for a tagged release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spendsnap-release.jks"
      - name: Materialize Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
      - name: Build release AAB
        env:
          SPENDSNAP_KEYSTORE_FILE: ${{ runner.temp }}/spendsnap-release.jks
          SPENDSNAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPENDSNAP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPENDSNAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Upload tagged AAB
        uses: actions/upload-artifact@v4
        with:
          name: spendsnap-release-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
